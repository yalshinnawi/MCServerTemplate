services:
  minecraft:
    image: itzg/minecraft-server:java21
    container_name: mc-create-server
    restart: unless-stopped
    stdin_open: true
    tty: true
    stop_grace_period: 60s
    ports:
      - "25565:25565"
      - "25575:25575"
    environment:
      # Licensing and Core Engine
      EULA: "TRUE"
      TYPE: "NEOFORGE"
      VERSION: "${MC_VERSION:-1.21.1}"
      NEOFORGE_VERSION: "${LOADER_VERSION:-21.1.264}"
      FORGE_VERSION: "${LOADER_VERSION:-21.1.264}"

      # Memory Allocation (Container limit: 11G, JVM: 9G)
      MEMORY: "${MEMORY:-9G}"
      INIT_MEMORY: "4G"

      # Garbage Collection: Generational ZGC for low-latency tick cycles
      # NOTE: USE_AIKAR_FLAGS is disabled to prevent conflicting G1GC flags
      USE_AIKAR_FLAGS: "false"
      JVM_XX_OPTS: "-XX:+UseZGC -XX:+ZGenerational -XX:+AlwaysPreTouch -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC"

      # Dual-Core / Modpack Performance Optimizations
      MAX_TICK_TIME: "-1"         # Disables watchdog timeout shutdowns during slow chunk/physics ticks
      VIEW_DISTANCE: "6"          # Reduces chunk render radius to ease dual-core CPU strain
      SIMULATION_DISTANCE: "4"    # Keeps active entity/block updates tightly focused around players
      SYNC_CHUNK_WRITES: "false"  # Offloads chunk writes asynchronously to eliminate I/O lag spikes

      # Remote Console (RCON)
      ENABLE_RCON: "true"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${RCON_PASSWORD:-ChangeMeSecureRconPassword!}"

      # Gameplay & Server Properties
      MOTD: "Create Aeronautics Skybound (Docker Production)"
      ALLOW_FLIGHT: "true"        # Required for Create Aeronautics physics, airships, and gliders
      SPAWN_PROTECTION: "0"
      ENABLE_COMMAND_BLOCK: "true"
      MAX_PLAYERS: "10"
      DIFFICULTY: "normal"
      MODE: "survival"
      PVP: "true"
      ONLINE_MODE: "true"
      TZ: "UTC"

    volumes:
      - ./data:/data

    deploy:
      resources:
        limits:
          memory: ${CONTAINER_MEM_LIMIT:-11G}
          cpus: "2.0"
        reservations:
          memory: ${MEMORY:-9G}

    # Fallback memory limit for Docker Compose v1 / non-swarm engines
    mem_limit: ${CONTAINER_MEM_LIMIT:-11G}

  # Optional Cross-Platform Playit.gg Tunnel Container
  # Enables internet access without router port-forwarding across any OS (Linux, macOS, Windows)
  # Launch with: docker compose --profile tunnel up -d  (or: .\manage.ps1 up -Tunnel)
  playit:
    image: plypkg/playit:latest
    container_name: mc-playit-tunnel
    restart: unless-stopped
    profiles:
      - tunnel
      - playit
    volumes:
      - ./data/playit:/etc/playit
    depends_on:
      - minecraft
